name: Build K2P ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 \
            --branch openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure K2P
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y

          # Remove unnecessary packages
          # CONFIG_PACKAGE_luci-app-ddns is not set
          # CONFIG_PACKAGE_luci-app-upnp is not set
          # CONFIG_PACKAGE_luci-app-wol is not set
          # CONFIG_PACKAGE_luci-app-wireguard is not set
          # CONFIG_PACKAGE_luci-app-udpxy is not set
          # CONFIG_PACKAGE_luci-app-vlmcsd is not set
          # CONFIG_PACKAGE_luci-app-arpbind is not set
          # CONFIG_PACKAGE_ipv6helper is not set
          EOF

          make defconfig

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s

      - name: Find firmware
        run: |
          mkdir -p output
          find immortalwrt/bin/targets/ramips/mt7621/ \
            -type f \
            \( -name '*k2p*' -o -name '*phicomm*' \) \
            -exec cp {} output/ \; || true

          ls -lh output

      - name: Check firmware size
        run: |
          echo "Firmware files:"
          ls -lh output/

          for f in output/*; do
            [ -f "$f" ] || continue

            size=$(stat -c%s "$f")

            echo "Checking: $f"
            echo "Size: $size bytes"

            # 15.0 MiB safety limit
            if [ "$size" -gt 15728640 ]; then
              echo "ERROR: firmware is too large for the 16MB K2P"
              exit 1
            fi
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-ImmortalWrt
          path: output/
