name: Build K2P ImmortalWrt 24.10.4 + sing-box auto-urltest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      IW_VERSION: "24.10.4"
      TARGET: "ramips"
      SUBTARGET: "mt7621"
      PROFILE: "phicomm_k2p"
      SINGBOX_VERSION: "1.12.25"
      GOPROXY: "https://goproxy.cn,direct"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget ca-certificates python3 file

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false

      - name: Download sing-box source
        run: |
          set -eux
          curl -fL --retry 5 --retry-delay 2 \
            -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/archive/refs/tags/v${SINGBOX_VERSION}.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/build"
          tar -xzf /tmp/sing-box.tar.gz -C "$GITHUB_WORKSPACE/build"
          mv "$GITHUB_WORKSPACE/build/sing-box-${SINGBOX_VERSION}" "$GITHUB_WORKSPACE/build/sing-box"

      - name: Patch registry - keep TUN HTTP selector urltest
        run: |
          set -eux
          python3 scripts/patch_registry.py "$GITHUB_WORKSPACE/build/sing-box/include/registry.go"
          gofmt -w "$GITHUB_WORKSPACE/build/sing-box/include/registry.go"
          grep -E 'Register(Inbound|Outbound|Selector|URLTest)' \
            "$GITHUB_WORKSPACE/build/sing-box/include/registry.go" || true

      - name: Cross-compile sing-box for MT7621
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/files/usr/bin"
          cd "$GITHUB_WORKSPACE/build/sing-box"
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=mipsle \
          GOMIPS=softfloat \
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o "$GITHUB_WORKSPACE/files/usr/bin/sing-box" \
            ./cmd/sing-box
          chmod 0755 "$GITHUB_WORKSPACE/files/usr/bin/sing-box"
          ls -lh "$GITHUB_WORKSPACE/files/usr/bin/sing-box"
          file "$GITHUB_WORKSPACE/files/usr/bin/sing-box"

      - name: Download ImmortalWrt ImageBuilder
        run: |
          set -eux
          IMAGEBUILDER="immortalwrt-imagebuilder-${IW_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.zst"
          BASE_URL="https://downloads.immortalwrt.org/releases/${IW_VERSION}/targets/${TARGET}/${SUBTARGET}"
          wget -O "/tmp/${IMAGEBUILDER}" "${BASE_URL}/${IMAGEBUILDER}"
          mkdir -p "$GITHUB_WORKSPACE/imagebuilder"
          tar --zstd -xf "/tmp/${IMAGEBUILDER}" -C "$GITHUB_WORKSPACE/imagebuilder" --strip-components=1

      - name: Build K2P firmware
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/imagebuilder"
          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="kmod-tun kmod-inet-diag kmod-netlink-diag ca-bundle" \
            FILES="$GITHUB_WORKSPACE/files"

      - name: Validate and collect
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/dist"
          FW="$(find "$GITHUB_WORKSPACE/imagebuilder/bin/targets/${TARGET}/${SUBTARGET}" \
            -type f -name '*phicomm_k2p*squashfs-sysupgrade.bin' | head -n 1)"
          test -n "$FW"
          SIZE="$(stat -c '%s' "$FW")"
          MAX=$((0xF60000))
          echo "Firmware bytes: $SIZE"
          echo "K2P firmware partition bytes: $MAX"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: image exceeds K2P firmware partition."
            exit 1
          fi
          cp "$FW" "$GITHUB_WORKSPACE/dist/"
          sha256sum "$GITHUB_WORKSPACE/dist/"*.bin | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS"
          cp "$GITHUB_WORKSPACE/files/usr/bin/sing-box" "$GITHUB_WORKSPACE/dist/sing-box-mipsle"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: k2p-immortalwrt-24.10.4-singbox-auto-urltest
          path: dist/
          if-no-files-found: error
