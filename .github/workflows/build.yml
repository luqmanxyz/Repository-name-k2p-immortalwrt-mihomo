name: Build K2P ImmortalWrt OpenClash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            gnutls-dev \
            gperf \
            libelf-dev \
            libncurses5-dev \
            libncursesw5 \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lld \
            cmake \
            ninja-build \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-pyelftools \
            rsync \
            squashfs-tools \
            swig \
            unzip \
            wget \
            curl \
            file \
            zlib1g-dev

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth=1 \
            --single-branch \
            --branch openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

      - name: Add OpenClash
        working-directory: immortalwrt
        run: |
          git clone \
            --depth=1 \
            --branch v0.47.015 \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash

      - name: Prepare xz source
        working-directory: immortalwrt
        run: |
          mkdir -p dl

          curl -L --fail --retry 5 \
            -o dl/xz-5.4.3.tar.bz2 \
            https://github.com/tukaani-project/xz/releases/download/v5.4.3/xz-5.4.3.tar.bz2

          file dl/xz-5.4.3.tar.bz2
          ls -lh dl/xz-5.4.3.tar.bz2

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure K2P
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_unzip=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          CONFIG_IPV6=n
          CONFIG_PACKAGE_ipv6helper=n

          # 不安装额外 LuCI 插件
          # CONFIG_PACKAGE_luci-app-ddns is not set
          # CONFIG_PACKAGE_luci-app-upnp is not set
          # CONFIG_PACKAGE_luci-app-wol is not set
          # CONFIG_PACKAGE_luci-app-wireguard is not set
          # CONFIG_PACKAGE_luci-app-udpxy is not set
          # CONFIG_PACKAGE_luci-app-vlmcsd is not set
          # CONFIG_PACKAGE_luci-app-arpbind is not set
          # CONFIG_PACKAGE_luci-app-passwall is not set
          # CONFIG_PACKAGE_luci-app-passwall2 is not set
          # CONFIG_PACKAGE_luci-app-ssr-plus is not set
          # CONFIG_PACKAGE_luci-app-homeproxy is not set
          # CONFIG_PACKAGE_ipset is not set
          EOF

          make defconfig

      - name: Check configuration
        working-directory: immortalwrt
        run: |
          echo "========== TARGET =========="
          grep -E \
            "CONFIG_TARGET_ramips|CONFIG_TARGET_ramips_mt7621|CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p" \
            .config || true

          echo
          echo "========== OPENCLASH =========="
          grep "CONFIG_PACKAGE_luci-app-openclash" .config || true

          echo
          echo "========== TUN / TPROXY =========="
          grep -E \
            "CONFIG_PACKAGE_kmod-tun|CONFIG_PACKAGE_kmod-nft-tproxy" \
            .config || true

          echo
          echo "========== IPV6 =========="
          grep -E \
            "CONFIG_IPV6|CONFIG_PACKAGE_ipv6helper" \
            .config || true

      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j$(nproc)

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          echo "========== BUILD START =========="
          echo "CPU cores: $(nproc)"
          echo

          free -h

          echo
          df -h

          echo
          echo "========== COMPILING =========="

          make -j$(nproc)

      - name: Collect firmware
        run: |
          set -e

          mkdir -p output

          echo "========== BUILD OUTPUT =========="

          ls -lh immortalwrt/bin/targets/ramips/mt7621/

          echo
          echo "========== FIND K2P FIRMWARE =========="

          find immortalwrt/bin/targets/ramips/mt7621/ \
            -maxdepth 1 \
            -type f \
            -name "*k2p*sysupgrade.bin" \
            -exec cp {} output/ \;

          echo
          echo "========== OUTPUT =========="

          ls -lh output/

          if ! ls output/*sysupgrade.bin >/dev/null 2>&1; then
            echo "ERROR: K2P sysupgrade firmware not found."
            exit 1
          fi

      - name: Check firmware size
        run: |
          set -e

          MAX_SIZE=$((0x00f60000))

          echo "========== SIZE CHECK =========="
          echo "K2P firmware partition limit: $MAX_SIZE bytes"

          for f in output/*sysupgrade.bin; do
            size=$(stat -c%s "$f")
            mib=$(awk "BEGIN {printf \"%.2f\", $size/1048576}")

            echo
            echo "File: $f"
            echo "Size: $size bytes"
            echo "Size: $mib MiB"

            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo
              echo "ERROR: Firmware is too large for K2P."
              echo "DO NOT FLASH."
              exit 1
            fi

            echo "SIZE OK"
          done

      - name: SHA256
        run: |
          echo "========== SHA256 =========="
          sha256sum output/*sysupgrade.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-ImmortalWrt-OpenClash
          path: output/*sysupgrade.bin
          if-no-files-found: error
