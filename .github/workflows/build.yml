name: Build K2P ImmortalWrt OpenClash

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

```
steps:

  # =========================================================
  # 1. Checkout
  # =========================================================
  - name: Checkout
    uses: actions/checkout@v4


  # =========================================================
  # 2. Free disk space
  # =========================================================
  - name: Free disk space
    run: |
      echo "========== DISK BEFORE =========="
      df -h

      sudo rm -rf /usr/local/lib/android
      sudo rm -rf /usr/share/dotnet
      sudo rm -rf /opt/ghc
      sudo rm -rf /opt/hostedtoolcache

      echo
      echo "========== DISK AFTER =========="
      df -h


  # =========================================================
  # 3. Install build dependencies
  # =========================================================
  - name: Install build dependencies
    run: |
      sudo apt-get update

      sudo apt-get install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gettext \
        git \
        gnutls-dev \
        gperf \
        libelf-dev \
        libncurses5-dev \
        libncursesw5 \
        libncursesw5-dev \
        libpython3-dev \
        libreadline-dev \
        libssl-dev \
        libtool \
        llvm \
        lld \
        cmake \
        ninja-build \
        pkgconf \
        python3 \
        python3-pip \
        python3-ply \
        python3-pyelftools \
        rsync \
        squashfs-tools \
        swig \
        unzip \
        wget \
        curl \
        file \
        zlib1g-dev

      echo
      echo "========== BUILD ENVIRONMENT =========="
      gcc --version | head -1
      make --version | head -1
      python3 --version
      git --version


  # =========================================================
  # 4. Clone ImmortalWrt 23.05
  # =========================================================
  - name: Clone ImmortalWrt
    run: |
      git clone \
        --depth=1 \
        --single-branch \
        --branch openwrt-23.05 \
        https://github.com/immortalwrt/immortalwrt.git \
        immortalwrt

      cd immortalwrt

      echo
      echo "========== IMMORTALWRT VERSION =========="
      git log -1 --oneline


  # =========================================================
  # 5. Add OpenClash 0.47.015
  # =========================================================
  - name: Add OpenClash
    working-directory: immortalwrt
    run: |
      git clone \
        --depth=1 \
        --branch v0.47.015 \
        https://github.com/vernesong/OpenClash.git \
        package/luci-app-openclash

      echo
      echo "========== OPENCLASH VERSION =========="
      git -C package/luci-app-openclash log -1 --oneline


  # =========================================================
  # 6. Prepare xz source
  # =========================================================
  - name: Prepare xz source
    working-directory: immortalwrt
    run: |
      mkdir -p dl

      curl -L --fail --retry 5 \
        -o dl/xz-5.4.3.tar.bz2 \
        https://github.com/tukaani-project/xz/releases/download/v5.4.3/xz-5.4.3.tar.bz2

      echo
      echo "========== XZ SOURCE =========="
      file dl/xz-5.4.3.tar.bz2
      ls -lh dl/xz-5.4.3.tar.bz2


  # =========================================================
  # 7. Update feeds
  # =========================================================
  - name: Update feeds
    working-directory: immortalwrt
    run: |
      ./scripts/feeds update -a
      ./scripts/feeds install -a


  # =========================================================
  # 8. Configure K2P
  # =========================================================
  - name: Configure K2P
    working-directory: immortalwrt
    run: |

      cat > .config <<'EOF'

      # =====================================================
      # K2P TARGET
      # =====================================================

      CONFIG_TARGET_ramips=y
      CONFIG_TARGET_ramips_mt7621=y
      CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y


      # =====================================================
      # FILESYSTEM
      # =====================================================

      CONFIG_TARGET_ROOTFS_SQUASHFS=y
      CONFIG_TARGET_IMAGES_GZIP=y
      CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024


      # =====================================================
      # LUCI
      # =====================================================

      CONFIG_PACKAGE_luci=y
      CONFIG_PACKAGE_luci-compat=y
      CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


      # =====================================================
      # DNS
      # =====================================================

      CONFIG_PACKAGE_dnsmasq-full=y


      # =====================================================
      # FIREWALL
      # =====================================================

      CONFIG_PACKAGE_firewall4=y
      CONFIG_PACKAGE_luci-app-firewall=y
      CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y


      # =====================================================
      # OPENCLASH
      # =====================================================

      CONFIG_PACKAGE_luci-app-openclash=y


      # =====================================================
      # OPENCLASH DEPENDENCIES
      # =====================================================

      CONFIG_PACKAGE_bash=y
      CONFIG_PACKAGE_curl=y
      CONFIG_PACKAGE_ca-bundle=y
      CONFIG_PACKAGE_ip-full=y


      # =====================================================
      # OPENCLASH KERNEL SUPPORT
      # =====================================================

      CONFIG_PACKAGE_kmod-tun=y
      CONFIG_PACKAGE_kmod-nft-tproxy=y


      # =====================================================
      # DISABLE IPV6
      # =====================================================

      CONFIG_IPV6=n
      CONFIG_PACKAGE_ipv6helper=n


      # =====================================================
      # REMOVE UNNECESSARY LUCI PLUGINS
      # =====================================================

      # CONFIG_PACKAGE_luci-app-ddns is not set
      # CONFIG_PACKAGE_luci-app-upnp is not set
      # CONFIG_PACKAGE_luci-app-wol is not set
      # CONFIG_PACKAGE_luci-app-wireguard is not set
      # CONFIG_PACKAGE_luci-app-udpxy is not set
      # CONFIG_PACKAGE_luci-app-vlmcsd is not set
      # CONFIG_PACKAGE_luci-app-arpbind is not set

      # CONFIG_PACKAGE_luci-app-passwall is not set
      # CONFIG_PACKAGE_luci-app-passwall2 is not set
      # CONFIG_PACKAGE_luci-app-ssr-plus is not set
      # CONFIG_PACKAGE_luci-app-homeproxy is not set

      # CONFIG_PACKAGE_ipset is not set


      # =====================================================
      # REMOVE RUBY
      # =====================================================

      # CONFIG_PACKAGE_ruby is not set
      # CONFIG_PACKAGE_libruby3.2 is not set
      # CONFIG_PACKAGE_ruby-bigdecimal is not set
      # CONFIG_PACKAGE_ruby-date is not set
      # CONFIG_PACKAGE_ruby-digest is not set
      # CONFIG_PACKAGE_ruby-enc is not set
      # CONFIG_PACKAGE_ruby-forwardable is not set
      # CONFIG_PACKAGE_ruby-pstore is not set
      # CONFIG_PACKAGE_ruby-psych is not set
      # CONFIG_PACKAGE_ruby-stringio is not set
      # CONFIG_PACKAGE_ruby-yaml is not set


      # =====================================================
      # REMOVE UNNECESSARY TOOLS
      # =====================================================

      # CONFIG_PACKAGE_unzip is not set
      # CONFIG_PACKAGE_shellsync is not set
      # CONFIG_PACKAGE_ubi-utils is not set
      # CONFIG_PACKAGE_kmod-inet-diag is not set

      EOF

      echo "========== MAKE DECONFIG =========="
      make defconfig


  # =========================================================
  # 9. Verify configuration
  # =========================================================
  - name: Verify configuration
    working-directory: immortalwrt
    run: |

      echo "========== TARGET =========="

      grep -E \
        'CONFIG_TARGET_ramips|CONFIG_TARGET_ramips_mt7621|phicomm_k2p' \
        .config || true


      echo
      echo "========== OPENCLASH =========="

      grep \
        'CONFIG_PACKAGE_luci-app-openclash' \
        .config || true


      echo
      echo "========== OPENCLASH DEPENDENCIES =========="

      grep -E \
        'CONFIG_PACKAGE_(bash|curl|ca-bundle|ip-full)' \
        .config || true


      echo
      echo "========== KERNEL SUPPORT =========="

      grep -E \
        'CONFIG_PACKAGE_kmod-tun|CONFIG_PACKAGE_kmod-nft-tproxy' \
        .config || true


      echo
      echo "========== IPV6 =========="

      grep -E \
        'CONFIG_IPV6|CONFIG_PACKAGE_ipv6helper' \
        .config || true


      echo
      echo "========== SQUASHFS =========="

      grep \
        'CONFIG_TARGET_SQUASHFS_BLOCK_SIZE' \
        .config || true


      echo
      echo "========== RUBY CHECK =========="

      if grep -E '^CONFIG_PACKAGE_(ruby|libruby|ruby-)' .config; then
        echo "WARNING: Ruby is still enabled."
      else
        echo "Ruby: NOT ENABLED"
      fi


      echo
      echo "========== UNNECESSARY PACKAGE CHECK =========="

      if grep -E \
        '^CONFIG_PACKAGE_(unzip|shellsync|ubi-utils|kmod-inet-diag)=' \
        .config; then

        echo "WARNING: Unnecessary package still enabled."

      else

        echo "Unnecessary packages: NOT ENABLED"

      fi


      echo
      echo "========== PACKAGE COUNT =========="

      grep '^CONFIG_PACKAGE_.*=y' .config | wc -l


  # =========================================================
  # 10. Download sources
  # =========================================================
  - name: Download sources
    working-directory: immortalwrt
    run: |
      echo "========== DOWNLOAD SOURCES =========="

      make download -j$(nproc)


  # =========================================================
  # 11. Build firmware
  #
  # IMPORTANT:
  # Do NOT use V=s here.
  # This prevents GitHub Actions from producing an enormous
  # log and freezing the web page.
  # =========================================================
  - name: Build firmware
    working-directory: immortalwrt
    run: |

      echo "========== BUILD START =========="

      echo "CPU cores:"
      nproc

      echo
      echo "Memory:"
      free -h

      echo
      echo "Disk:"
      df -h

      echo
      echo "========== COMPILING =========="

      make -j$(nproc)


  # =========================================================
  # 12. Inspect build output
  # =========================================================
  - name: Inspect build output
    run: |

      echo "========== TARGET DIRECTORY =========="

      ls -lah \
        immortalwrt/bin/targets/ramips/mt7621/


      echo
      echo "========== BIN FILES =========="

      find \
        immortalwrt/bin/targets/ramips/mt7621/ \
        -maxdepth 1 \
        -type f \
        -name '*.bin' \
        -exec ls -lh {} \;


      echo
      echo "========== SYSUPGRADE FILES =========="

      find \
        immortalwrt/bin/targets/ramips/mt7621/ \
        -maxdepth 1 \
        -type f \
        -name '*sysupgrade.bin' \
        -exec ls -lh {} \;


  # =========================================================
  # 13. Collect K2P sysupgrade
  # =========================================================
  - name: Collect K2P sysupgrade
    run: |

      set -e

      mkdir -p output

      echo "========== SEARCH K2P SYSUPGRADE =========="

      find \
        immortalwrt/bin/targets/ramips/mt7621/ \
        -maxdepth 1 \
        -type f \
        -name '*sysupgrade.bin' \
        -print


      echo
      echo "========== COPY K2P FIRMWARE =========="

      find \
        immortalwrt/bin/targets/ramips/mt7621/ \
        -maxdepth 1 \
        -type f \
        \( \
          -name '*phicomm_k2p*sysupgrade.bin' \
          -o \
          -name '*phicomm-k2p*sysupgrade.bin' \
          -o \
          -name '*k2p*sysupgrade.bin' \
        \) \
        -exec cp {} output/ \;


      echo
      echo "========== COLLECTED FILE =========="

      ls -lh output/


      if ! ls output/*sysupgrade.bin >/dev/null 2>&1; then
        echo "ERROR: No K2P sysupgrade firmware found."
        exit 1
      fi


  # =========================================================
  # 14. Check firmware size
  # =========================================================
  - name: Check K2P sysupgrade size
    run: |

      set -e

      echo "========== K2P SYSUPGRADE SIZE =========="


      # K2P firmware partition:
      #
      # mtd4:
      # 00f60000
      #
      # 0x00f60000 = 16056320 bytes
      #
      MAX_SIZE=$((0x00f60000))


      echo "Maximum K2P firmware size:"
      echo "$MAX_SIZE bytes"


      for f in output/*sysupgrade.bin; do

        size=$(stat -c%s "$f")

        mib=$(awk \
          "BEGIN {printf \"%.3f\", $size/1048576}")


        echo
        echo "File: $f"
        echo "Bytes: $size"
        echo "MiB: $mib"


        if [ "$size" -gt "$MAX_SIZE" ]; then

          echo
          echo "ERROR: Firmware is larger than K2P firmware partition."
          echo "DO NOT FLASH THIS IMAGE."

          exit 1

        fi


        echo "SIZE CHECK PASSED"

      done


  # =========================================================
  # 15. Final firmware information
  # =========================================================
  - name: Final firmware information
    run: |

      echo "========== FINAL FIRMWARE =========="

      ls -lh output/


      echo
      echo "========== SHA256 =========="

      sha256sum output/*sysupgrade.bin


      echo
      echo "========== BUILD COMPLETE =========="


  # =========================================================
  # 16. Upload firmware
  # =========================================================
  - name: Upload firmware
    uses: actions/upload-artifact@v4
    with:
      name: K2P-ImmortalWrt-OpenClash
      path: output/*sysupgrade.bin
      if-no-files-found: error
```
