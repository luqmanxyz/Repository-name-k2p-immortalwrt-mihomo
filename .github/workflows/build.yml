name: Build K2P ImmortalWrt OpenClash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth=1 \
            --branch openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

      - name: Add OpenClash
        working-directory: immortalwrt
        run: |
          git clone \
            --depth=1 \
            --branch v0.47.015 \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure K2P
        working-directory: immortalwrt
        run: |

          cat > .config <<'EOF'

          # =====================================================
          # K2P MT7621
          # =====================================================

          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y


          # =====================================================
          # LuCI
          # =====================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # =====================================================
          # Network
          # =====================================================

          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_unzip=y


          # =====================================================
          # OpenClash nftables
          # =====================================================

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y

          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y


          # =====================================================
          # IPv6 OFF
          # =====================================================

          CONFIG_IPV6=n
          CONFIG_PACKAGE_ipv6helper=n


          # =====================================================
          # Remove unnecessary applications
          # =====================================================

          # CONFIG_PACKAGE_luci-app-ddns is not set
          # CONFIG_PACKAGE_luci-app-upnp is not set
          # CONFIG_PACKAGE_luci-app-wol is not set
          # CONFIG_PACKAGE_luci-app-wireguard is not set
          # CONFIG_PACKAGE_luci-app-udpxy is not set
          # CONFIG_PACKAGE_luci-app-vlmcsd is not set
          # CONFIG_PACKAGE_luci-app-arpbind is not set

          # CONFIG_PACKAGE_luci-app-passwall is not set
          # CONFIG_PACKAGE_luci-app-passwall2 is not set
          # CONFIG_PACKAGE_luci-app-ssr-plus is not set
          # CONFIG_PACKAGE_luci-app-homeproxy is not set

          EOF

          make defconfig


      - name: Verify configuration
        working-directory: immortalwrt
        run: |

          echo "========== TARGET =========="

          grep -E \
            'CONFIG_TARGET_ramips|CONFIG_TARGET_ramips_mt7621|phicomm_k2p' \
            .config || true

          echo
          echo "========== OPENCLASH =========="

          grep \
            'CONFIG_PACKAGE_luci-app-openclash' \
            .config || true

          echo
          echo "========== TUN / TPROXY =========="

          grep -E \
            'CONFIG_PACKAGE_kmod-tun|CONFIG_PACKAGE_kmod-nft-tproxy|CONFIG_PACKAGE_kmod-inet-diag' \
            .config || true

          echo
          echo "========== IPV6 =========="

          grep -E \
            'CONFIG_IPV6|CONFIG_PACKAGE_ipv6helper' \
            .config || true


      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s


      - name: Collect K2P firmware
        run: |

          mkdir -p output

          find immortalwrt/bin/targets/ramips/mt7621/ \
            -type f \
            \( \
              -name '*phicomm-k2p*' \
              -o \
              -name '*k2p*' \
            \) \
            -exec cp {} output/ \;

          echo
          echo "========== GENERATED FILES =========="

          ls -lh output/


      - name: Check firmware size
        run: |

          echo "========== SIZE CHECK =========="

          found=0

          for f in output/*; do

            [ -f "$f" ] || continue

            found=1

            size=$(stat -c%s "$f")

            echo
            echo "File: $f"
            echo "Bytes: $size"
            echo "MiB: $(awk "BEGIN {printf \"%.2f\", $size/1048576}")"

            if [ "$size" -gt 15728640 ]; then
              echo
              echo "ERROR: Firmware exceeds 15 MiB safety limit."
              echo "K2P has a 16 MiB flash chip."
              exit 1
            fi

          done

          if [ "$found" -eq 0 ]; then
            echo
            echo "ERROR: No K2P firmware found."
            exit 1
          fi


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-ImmortalWrt-OpenClash
          path: output/
